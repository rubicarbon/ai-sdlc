# ai-sdlc: environment tiers with a human-gated production stage.
# The "production" environment carries an Approvals check (configured in Pipelines >
# Environments, see docs/PLATFORM-SETUP.md); that approval is the human gate.
# Runs of this pipeline are what /ai-sdlc:sdlc-metrics-report counts as deployments
# (azure.deployPipelineName). The deploy commands are the ones configured in
# sdlc.config.json (commands.deployStaging and commands.deployProduction);
# SDLC_ENVIRONMENT and SDLC_SHA are exported to them.
trigger: none
pr: none

parameters:
  - name: sha
    displayName: Commit to deploy (empty = this run's commit)
    type: string
    default: ""

pool:
  vmImage: ubuntu-latest

variables:
  - name: SDLC_SHA
    ${{ if ne(parameters.sha, '') }}:
      value: ${{ parameters.sha }}
    ${{ else }}:
      value: $(Build.SourceVersion)

stages:
  - stage: staging
    displayName: Deploy to staging (automatic)
    jobs:
      - deployment: staging
        environment: staging
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - script: |
                    {{COMMANDS_DEPLOY_STAGING}}
                  displayName: Deploy to staging (commands.deployStaging)
                  env:
                    SDLC_ENVIRONMENT: staging
                    SDLC_SHA: $(SDLC_SHA)

  - stage: production
    displayName: Deploy to production (human approval required)
    dependsOn: staging
    jobs:
      - deployment: production
        environment: production
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - script: |
                    {{COMMANDS_DEPLOY_PRODUCTION}}
                  displayName: Deploy to production (commands.deployProduction)
                  env:
                    SDLC_ENVIRONMENT: production
                    SDLC_SHA: $(SDLC_SHA)
