# ai-sdlc: environment tiers with a human-gated production step.
# staging deploys automatically; production runs in the GitHub environment "production",
# whose required reviewers (set in Settings > Environments, see docs/PLATFORM-SETUP.md)
# are the human gate. Each deployment is recorded through the Deployments API so
# /ai-sdlc:sdlc-metrics-report can compute deployment frequency, lead time and CFR.
# The deploy commands are the ones configured in sdlc.config.json (commands.deployStaging
# and commands.deployProduction); SDLC_ENVIRONMENT and SDLC_SHA are exported to them.
name: sdlc-deploy

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit to deploy (defaults to the workflow's commit)"
        required: false
        default: ""

permissions:
  contents: read
  deployments: write

concurrency:
  group: sdlc-deploy
  cancel-in-progress: false

jobs:
  staging:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30
    env:
      SDLC_ENVIRONMENT: staging
      SDLC_SHA: ${{ inputs.sha != '' && inputs.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SDLC_SHA }}
      - name: Deploy to staging (commands.deployStaging)
        run: |
          {{COMMANDS_DEPLOY_STAGING}}

  production:
    needs: staging
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SDLC_ENVIRONMENT: production
      SDLC_SHA: ${{ inputs.sha != '' && inputs.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SDLC_SHA }}
      - name: Open a deployment record
        id: dep
        run: |
          id=$(gh api -X POST "repos/${{ github.repository }}/deployments" -f ref="$SDLC_SHA" -f environment=production -F auto_merge=false -F required_contexts='[]' --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"
          gh api -X POST "repos/${{ github.repository }}/deployments/$id/statuses" -f state=in_progress >/dev/null
      - name: Deploy to production (commands.deployProduction)
        run: |
          {{COMMANDS_DEPLOY_PRODUCTION}}
      - name: Close the deployment record
        if: always()
        run: |
          state=success; [ "${{ job.status }}" = "success" ] || state=failure
          gh api -X POST "repos/${{ github.repository }}/deployments/${{ steps.dep.outputs.id }}/statuses" -f state="$state" -f log_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >/dev/null
